<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Flow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Focus Flow</h1>
      <div class="streak" id="streak">
        <span class="flame">🔥</span>
        <span id="streak-count">0</span>
        <span class="streak-label">day streak</span>
      </div>
    </header>

    <main>
      <section class="timer-card">
        <div class="mode-tabs">
          <button class="mode-tab active" data-mode="focus">Focus</button>
          <button class="mode-tab" data-mode="short">Short Break</button>
          <button class="mode-tab" data-mode="long">Long Break</button>
        </div>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 220 220">
            <circle class="ring-track" cx="110" cy="110" r="100"></circle>
            <circle class="ring-progress" id="ring-progress" cx="110" cy="110" r="100"></circle>
          </svg>
          <div class="time-display" id="time-display">25:00</div>
        </div>

        <div class="active-task" id="active-task">No task selected</div>

        <div class="controls">
          <button class="btn secondary" id="reset-btn">Reset</button>
          <button class="btn primary" id="start-btn">Start</button>
          <button class="btn secondary" id="skip-btn">Skip</button>
        </div>

        <div class="session-dots" id="session-dots"></div>
      </section>

      <section class="task-card">
        <h2>Tasks</h2>
        <form id="task-form" class="task-form">
          <input type="text" id="task-input" placeholder="What are you working on?" autocomplete="off">
          <button type="submit" class="btn primary small">Add</button>
        </form>
        <ul id="task-list" class="task-list"></ul>
        <div class="stats">
          <div class="stat">
            <span class="stat-num" id="today-sessions">0</span>
            <span class="stat-label">sessions today</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="total-sessions">0</span>
            <span class="stat-label">sessions all-time</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="celebrate" id="celebrate"></div>
  <audio id="ding" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
